# ==============================================================================
# preseed.cfg - AUTO-Debian-KVM
# Instalación 100% desatendida y automatizada para Debian (KVM / QEMU)
# ==============================================================================

### Localización e Idioma ###
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i console-setup/layoutcode string es
d-i keyboard-configuration/xkb-keymap select es
d-i time/zone string Europe/Madrid
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Configuración de Red ###
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

### Réplica / Mirror de Debian ###
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Cuentas y Contraseñas ###
d-i passwd/root-login boolean true
d-i passwd/root-password password debian
d-i passwd/root-password-again password debian
d-i passwd/user-fullname string Debian User
d-i passwd/username string debian
d-i passwd/user-password password debian
d-i passwd/user-password-again password debian
d-i passwd/user-default-groups string audio cdrom video sudo

### Particionado Automático del Disco ###
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Selección de Paquetes Base y Herramientas ###
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string \
    sudo \
    curl \
    wget \
    git \
    openssh-server \
    qemu-guest-agent \
    spice-vdagent \
    ca-certificates \
    neovim \
    htop \
    net-tools

d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Instalación de GRUB ###
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/vda
d-i grub-pc/install_devices string /dev/vda
d-i grub-pc/install_devices_disks_changed boolean true

### Finalización ###
d-i finish-install/reboot_in_progress note
